<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Goldberg Planet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%236fae4e' stroke='%232c4a22' stroke-width='2'/%3E%3C/svg%3E" />
  <style>
    :root {
      --hotbar-slot: 50px;
      --hotbar-gap: 5px;
      --ux-touch-target: 44px;
    }
    html, body {
      margin: 0; padding: 0; overflow: hidden; background: #05060a; height: 100%;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      touch-action: none; overscroll-behavior: none;
    }
    #app { position: fixed; inset: 0; touch-action: none; }
    #app canvas { display: block; }
    .hud {
      position: fixed; font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace; font-size: 12px;
      color: #cfd8e3; pointer-events: none; user-select: none; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    #vitals {
      top: calc(8px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
      font-size: 11px; color: #6d7d94; letter-spacing: 0.3px;
    }
    #diag {
      top: calc(28px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
      line-height: 1.55; white-space: pre; display: none;
      background: rgba(8, 12, 20, 0.5); border: 1px solid rgba(140,160,190,0.14); border-radius: 8px;
      padding: 8px 10px; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    #help {
      bottom: calc(12px + env(safe-area-inset-bottom)); left: calc(12px + env(safe-area-inset-left));
      line-height: 1.6; color: #7e8fa5; white-space: pre; font-size: 11.5px;
      opacity: 1; transition: opacity 0.7s;
    }
    #help.hide { opacity: 0; }
    #msg {
      bottom: calc(126px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      color: #dfe9f6; text-align: center; line-height: 1.5; max-width: 84vw;
      opacity: 0; transition: opacity 0.3s;
      background: rgba(8, 12, 20, 0.55); border: 1px solid rgba(140,160,190,0.16); border-radius: 9px;
      padding: 5px 12px; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    }
    #msg.on { opacity: 1; }
    #flight {
      bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      color: #a8bcd6; font-size: 12px; letter-spacing: 0.6px; display: none; white-space: pre;
    }
    #crosshair {
      top: 50%; left: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
      background: rgba(255,255,255,0.85); border-radius: 50%;
      box-shadow: 0 0 3px rgba(0,0,0,0.9);
    }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #05060a; color: #cfd8e3; font-family: Consolas, monospace; font-size: 14px;
      z-index: 10; flex-direction: column; gap: 12px;
    }
    #splash .bar { width: 260px; height: 3px; background: #1a2230; }
    #splash .bar > div { height: 100%; width: 0%; background: #5b8fd6; transition: width 0.2s; }
    #hotbar {
      bottom: calc(12px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      display: flex; gap: var(--hotbar-gap); pointer-events: auto;
    }
    #hotbar .slot {
      width: var(--hotbar-slot); height: var(--hotbar-slot); position: relative; border-radius: 8px;
      background: rgba(10, 14, 22, 0.5); border: 1.5px solid rgba(150, 165, 185, 0.3);
      box-sizing: border-box; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    }
    #hotbar .swatch {
      position: absolute; inset: 8px; border-radius: 4px;
      box-shadow: inset -2px -3px 0 rgba(0,0,0,0.25), inset 2px 2px 0 rgba(255,255,255,0.18);
    }
    #hotbar .key { position: absolute; top: 2px; left: 5px; font-size: 9px; color: #93a3b8; }
    #hotbar .count { position: absolute; bottom: 2px; right: 5px; font-size: 11px; color: #eef3fa; text-shadow: 0 1px 2px rgba(0,0,0,0.9); }
    #crafting {
      top: calc(18px + env(safe-area-inset-top)); right: calc(16px + env(safe-area-inset-right));
      width: min(340px, calc(100vw - 32px)); max-height: min(70vh, 620px); overflow: auto;
      pointer-events: auto; display: flex; flex-direction: column; gap: 7px;
      background: rgba(7, 11, 18, 0.68); border: 1px solid rgba(165, 185, 210, 0.18); border-radius: 8px;
      padding: 9px; box-sizing: border-box; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #crafting.hide { display: none; }
    #crafting .craft-head {
      display: flex; align-items: center; justify-content: space-between;
      color: #dce7f4; font-size: 12px; letter-spacing: 0; padding: 0 2px 2px;
    }
    #crafting .craft-head span:last-child {
      color: #8fa2bb; border: 1px solid rgba(165, 185, 210, 0.22); border-radius: 4px;
      min-width: 20px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px;
    }
    #crafting .craft-row {
      display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start;
      border-top: 1px solid rgba(165, 185, 210, 0.11); padding-top: 7px;
    }
    #crafting button {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(180, 205, 230, 0.36);
      background: rgba(34, 54, 75, 0.72); color: #eff7ff; font: 18px/1 Consolas, monospace;
      cursor: pointer;
    }
    #crafting button:disabled {
      cursor: default; color: #617189; border-color: rgba(130, 150, 175, 0.18);
      background: rgba(18, 24, 34, 0.48);
    }
    #crafting .ready button { border-color: rgba(154, 220, 156, 0.62); color: #d8f4d5; }
    #crafting .craft-copy { min-width: 0; }
    #crafting strong { color: #f0f5fb; font-weight: 600; font-size: 12px; }
    #crafting p { margin: 2px 0 4px; color: #91a2b8; line-height: 1.35; font-size: 10.5px; }
    #crafting .craft-req { display: flex; flex-wrap: wrap; gap: 4px; }
    #crafting .craft-req span {
      border-radius: 4px; border: 1px solid rgba(165, 185, 210, 0.13);
      padding: 2px 5px; color: #aebdd0; font-size: 9.5px; line-height: 1.2;
    }
    #crafting .craft-req .ok { color: #cfe8c9; border-color: rgba(146, 206, 143, 0.28); }
    #crafting .craft-req .miss { color: #d0a69b; border-color: rgba(218, 141, 118, 0.22); }

    /* --- touch controls (enabled by adding .touch to body) --- */
    #joy {
      position: fixed; width: 128px; height: 128px; border-radius: 50%; display: none;
      background: rgba(10, 14, 24, 0.25); border: 1.5px solid rgba(165, 185, 210, 0.28);
      pointer-events: none; z-index: 5;
    }
    #joyknob {
      position: absolute; width: 56px; height: 56px; left: 36px; top: 36px; border-radius: 50%;
      background: rgba(185, 200, 222, 0.4); border: 1.5px solid rgba(215, 228, 245, 0.5);
    }
    .tbtn {
      position: fixed; border-radius: 50%; display: none; z-index: 5;
      background: rgba(10, 14, 24, 0.38); border: 1.5px solid rgba(165, 185, 210, 0.34);
      color: #dfe8f4; pointer-events: auto; user-select: none;
      font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace;
      align-items: center; justify-content: center; flex-direction: column; line-height: 1.1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
    .tbtn.press { background: rgba(95, 125, 175, 0.5); border-color: rgba(200, 218, 240, 0.6); }
    .tbtn .sub { font-size: 9px; color: #9fb0c6; }
    #btn-jump {
      width: 76px; height: 76px; font-size: 26px;
      right: calc(22px + env(safe-area-inset-right)); bottom: calc(118px + env(safe-area-inset-bottom));
    }
    #btn-down {
      width: 58px; height: 58px; font-size: 20px;
      right: calc(112px + env(safe-area-inset-right)); bottom: calc(96px + env(safe-area-inset-bottom));
    }
    #btn-plane {
      width: 60px; height: 60px; font-size: 21px;
      right: calc(30px + env(safe-area-inset-right)); bottom: calc(214px + env(safe-area-inset-bottom));
    }
    #btn-plane.ready { border-color: rgba(150, 210, 145, 0.7); color: #cdeec8; }
    #btn-craft {
      width: 66px; height: 42px; font-size: 11px; border-radius: 8px;
      left: calc(10px + env(safe-area-inset-left)); top: calc(58px + env(safe-area-inset-top));
    }
    #btn-craft.active { border-color: rgba(255, 210, 105, 0.58); color: #ffe1a0; }
    body.touch #btn-craft { display: flex; }
    body.touch.crafting-open #btn-jump,
    body.touch.crafting-open #btn-down,
    body.touch.crafting-open #btn-plane { display: none !important; }

    body.touch #help { display: none; }
    body.touch #crosshair { display: none; }
    body.touch #btn-jump { display: flex; }
    body.touch #btn-down.show { display: flex; }
    body.touch #btn-plane.show { display: flex; }
    body.touch { --hotbar-slot: 46px; --hotbar-gap: 5px; }
    body.touch #hotbar .key { display: none; }
    body.touch #crafting {
      top: auto; left: calc(10px + env(safe-area-inset-left)); right: calc(10px + env(safe-area-inset-right));
      bottom: calc(174px + env(safe-area-inset-bottom)); width: auto; max-height: 42vh;
    }
    body.ux-gamepad #crafting .craft-head span:last-child {
      min-width: 44px;
    }
    body.ux-laptop #crafting{ max-height: min(62vh, 540px); }
    body.ux-compact #diag {
      max-width: calc(100vw - 20px); max-height: 46vh; overflow: auto;
      white-space: pre-wrap;
    }
    body.ux-phone { --hotbar-slot: 42px; --hotbar-gap: 4px; }
    body.ux-phone #vitals {
      left: calc(74px + env(safe-area-inset-left));
      right: calc(10px + env(safe-area-inset-right));
      max-width: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10px;
    }
    body.ux-phone #msg {
      bottom: calc(72px + var(--hotbar-slot) + env(safe-area-inset-bottom));
      max-width: calc(100vw - 34px);
    }
    body.ux-phone #flight { bottom: calc(62px + var(--hotbar-slot) + env(safe-area-inset-bottom)); }
    body.ux-phone #crafting{
      left: calc(8px + env(safe-area-inset-left));
      right: calc(8px + env(safe-area-inset-right));
      bottom: calc(158px + env(safe-area-inset-bottom));
      max-height: 43vh;
      padding: 8px;
    }
    body.ux-phone #btn-jump {
      width: 72px; height: 72px;
      right: calc(18px + env(safe-area-inset-right)); bottom: calc(108px + env(safe-area-inset-bottom));
    }
    body.ux-phone #btn-plane {
      right: calc(24px + env(safe-area-inset-right)); bottom: calc(202px + env(safe-area-inset-bottom));
    }
    body.ux-phone #btn-craft {
      left: calc(8px + env(safe-area-inset-left)); top: calc(58px + env(safe-area-inset-top));
      width: 64px;
    }
    body.ux-phone #btn-down {
      right: calc(104px + env(safe-area-inset-right)); bottom: calc(88px + env(safe-area-inset-bottom));
    }
    body.ux-tablet.touch { --hotbar-slot: 52px; --hotbar-gap: 6px; }
    body.ux-tablet.touch #btn-jump { width: 88px; height: 88px; font-size: 30px; }
    body.ux-tablet.touch #btn-plane,
    body.ux-tablet.touch #btn-down { width: 66px; height: 66px; }
    body.ux-phone.ux-landscape #crafting{ max-height: 58vh; bottom: calc(72px + env(safe-area-inset-bottom)); }
    @media (max-width: 480px) {
      #crafting { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash"><div>forging planet…</div><div class="bar"><div id="splashbar"></div></div><div id="splashmsg" style="color:#5f7189;font-size:12px"></div></div>
  <div id="vitals" class="hud"></div>
  <div id="diag" class="hud"></div>
  <div id="msg" class="hud"></div>
  <div id="flight" class="hud"></div>
  <div id="crosshair" class="hud"></div>
  <div id="crafting" class="hud hide"></div>
  <div id="hotbar" class="hud"></div>
  <div id="help" class="hud"></div>
  <div id="joy"><div id="joyknob"></div></div>
  <div id="btn-jump" class="tbtn">▲</div>
  <div id="btn-down" class="tbtn">▼</div>
  <div id="btn-craft" class="tbtn">craft</div>
  <div id="btn-plane" class="tbtn">✈</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
