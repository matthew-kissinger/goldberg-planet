<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#29322c" />
  <title>Goldberg Planet · A world under your feet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,2 28,9 28,23 16,30 4,23 4,9' fill='%23667553' stroke='%23eee7d8' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/demo/hud.css" />
</head>
<body>
  <div id="app"></div>
  <div id="splash" role="status" aria-live="polite">
    <svg class="splash-mark" viewBox="0 0 72 72" fill="none" aria-hidden="true"><circle cx="36" cy="36" r="31" stroke="currentColor" stroke-width="1"/><path d="M36 5 63 21v30L36 67 9 51V21Z M36 5v62 M9 21l54 30 M63 21 9 51" stroke="currentColor" stroke-width=".7"/><path d="m36 21 14 10v15l-14 8-14-8V31Z" fill="#e8e2d1" stroke="currentColor"/></svg>
    <span class="eyebrow">A field expedition</span><h1>Goldberg Planet</h1><p>A world under your feet.</p>
    <div class="bar"><div id="splashbar"></div></div><div id="splashmsg">Preparing your expedition…</div>
  </div>
  <div id="vitals" class="hud"></div>
  <nav id="hud-actions" class="hud" aria-label="Expedition menus">
    <button class="hud-action" data-action="guide" aria-expanded="false" aria-controls="game-menu">Field guide <span class="shortcut">M</span></button>
    <button class="hud-action" data-action="satchel" aria-expanded="false" aria-controls="crafting">Satchel <span class="shortcut">B</span></button>
  </nav>
  <button id="objective-card" class="hud" aria-label="Read the current field note"></button>
  <div id="diag" class="hud"></div>
  <div id="msg" class="hud" role="status" aria-live="polite"></div>
  <div id="flight" class="hud"></div>
  <button id="build-strip" class="hud" aria-label="Place selected camp plan"></button>
  <div id="crosshair" class="hud" aria-hidden="true"></div>
  <div id="crafting" class="hide" role="dialog" aria-modal="true" aria-labelledby="satchel-title" tabindex="-1"></div>
  <div id="hotbar" class="hud"></div>
  <div id="help" class="hud"></div>
  <div id="game-menu" class="hide" role="dialog" aria-modal="true" aria-labelledby="guide-title" tabindex="-1"></div>
  <div id="joy" aria-hidden="true"><div id="joyknob"></div></div>
  <button id="btn-jump" class="tbtn" aria-label="Jump or climb">↑</button>
  <button id="btn-down" class="tbtn" aria-label="Descend">↓</button>
  <button id="btn-craft" class="tbtn" aria-label="Open satchel" aria-controls="crafting" aria-expanded="false">Satchel</button>
  <button id="btn-plane" class="tbtn" aria-label="Board or stow craft">Fly</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
